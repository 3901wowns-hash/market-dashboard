<title>시황 지표판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 상단 요약 헤더 → 선택 지표 상세 차트 → 구분별 카드 그리드(카드마다 90일 스파크라인). 한국 관례대로 상승=빨강, 하락=파랑 */
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14181f; --muted: #667085; --line: #e3e6eb; --grid: #eceef2;
  --up: #d6302f; --down: #1f5fd1; --flat: #8a93a3; --accent: #14181f; --focus: #1f5fd1;
  --font-body: "Noto Sans KR", system-ui, sans-serif; --font-num: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1218; --panel: #171b23; --ink: #e8ebf0; --muted: #98a2b3; --line: #262c37; --grid: #1f242e;
  --up: #ff6b66; --down: #6b9bff; --flat: #7c8596; --accent: #e8ebf0; --focus: #6b9bff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1218; --panel: #171b23; --ink: #e8ebf0; --muted: #98a2b3; --line: #262c37; --grid: #1f242e;
  --up: #ff6b66; --down: #6b9bff; --flat: #7c8596; --accent: #e8ebf0; --focus: #6b9bff; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
h1 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
.asof { color: var(--muted); font-size: 12px; font-family: var(--font-num); }
.note { color: var(--muted); font-size: 12px; margin: 0; }
.detail { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.dhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 8px 16px; }
.dname { font-size: 13px; color: var(--muted); }
.dval { font-family: var(--font-num); font-size: 30px; font-weight: 500; letter-spacing: -0.02em; }
.range { display: flex; gap: 4px; }
.range button { font: inherit; font-size: 12px; background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.range button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#big { width: 100%; height: auto; display: block; touch-action: pan-y; }
#tip { font-family: var(--font-num); font-size: 12px; color: var(--muted); min-height: 18px; }
section h2 { font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; text-transform: uppercase; }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 16px; align-items: start; }
.left { position: sticky; top: env(safe-area-inset-top, 0px); }
.list { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; max-height: calc(100vh - 40px); overflow-y: auto; }
.list h2 { position: sticky; top: 0; background: var(--panel); z-index: 1; margin: 0; padding: 10px 14px 6px; border-top: 1px solid var(--line); }
.list section:first-child h2 { border-top: 0; }
.row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto 56px; align-items: center; gap: 8px; padding: 7px 14px; background: transparent; border: 0; border-left: 3px solid transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.row:hover { background: var(--grid); }
.row[aria-pressed="true"] { background: var(--grid); border-left-color: var(--ink); }
.rname { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rname small { display: block; font-family: var(--font-num); font-size: 10px; color: var(--muted); }
.rnum { text-align: right; font-family: var(--font-num); line-height: 1.3; }
.rnum b { display: block; font-size: 13px; font-weight: 500; }
.rnum span { font-size: 11px; }
.spark { width: 56px; height: 24px; display: block; }
@media (max-width: 820px) { .layout { grid-template-columns: minmax(0, 1fr); } .left { position: static; } .list { max-height: none; } }
.err { padding: 24px; color: var(--muted); }
footer { color: var(--muted); font-size: 11px; line-height: 1.6; }
</style>

<div class="wrap">
  <header>
    <h1>시황 지표판</h1>
    <span class="asof" id="asof">불러오는 중</span>
  </header>
  <p class="note">전일 종가 기준입니다. 지표마다 기준일이 다릅니다. 국내 금리와 회사채는 한국은행 발표 기준이라 하루 늦고, 휴장일에는 직전 거래일 값이 표시됩니다.</p>

  <div class="layout">
  <div class="left">
  <div class="detail" id="detail" hidden>
    <div class="dhead">
      <div>
        <div class="dname" id="dname"></div>
        <div class="dval" id="dval"></div>
        <div class="chg" id="dchg"></div>
      </div>
      <div class="range" role="group" aria-label="기간">
        <button type="button" id="r1" data-n="22" aria-pressed="false">1개월</button>
        <button type="button" id="r3" data-n="66" aria-pressed="false">3개월</button>
        <button type="button" id="r6" data-n="90" aria-pressed="true">전체</button>
      </div>
    </div>
    <svg id="big" viewBox="0 0 720 260" role="img" aria-label="선택한 지표 추이"></svg>
    <div id="tip"></div>
  </div>

  </div>
  <div class="list" id="groups" aria-label="지표 목록"></div>
  </div>
  <footer>출처: Yahoo Finance(지수·환율·원자재), FRED(美 국채), 한국은행 ECOS(국고채·CD·회사채). 신용스프레드는 회사채 3년 금리에서 국고채 3년 금리를 뺀 값입니다. 매 영업일 오전 갱신.</footer>
</div>

<script>
(function () {
  var ORDER = ["국내주식", "해외주식", "변동성", "국내금리", "크레딧", "해외금리", "환율", "원자재"];
  var data = null, sel = "KOSPI", span = 90;
  var $ = function (id) { return document.getElementById(id); };
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };

  function fmt(it, v) {
    var u = it.unit;
    if (u === "%") return v.toFixed(3) + "%";
    if (u === "bp") return v.toFixed(1) + "bp";
    if (u === "$") return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (u === "원") return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "원";
    return v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function chgText(it) {
    var c = it.change, s = c > 0 ? "▲ " : c < 0 ? "▼ " : "– ";
    return s + Math.abs(c).toFixed(it.change_unit === "bp" ? 1 : 2) + it.change_unit;
  }
  function cls(it) { return it.change > 0 ? "up" : it.change < 0 ? "down" : "flat"; }
  function md(d) { return d.slice(5).replace("-", "/"); }

  function spark(pts, c) {
    var w = 200, h = 34, lo = Math.min.apply(null, pts.map(function (p) { return p[1]; })), hi = Math.max.apply(null, pts.map(function (p) { return p[1]; }));
    var r = hi - lo || 1, n = pts.length;
    var xy = pts.map(function (p, i) { return [(i / (n - 1)) * w, h - 3 - ((p[1] - lo) / r) * (h - 8)]; });
    var d = xy.map(function (q, i) { return (i ? "L" : "M") + q[0].toFixed(1) + " " + q[1].toFixed(1); }).join("");
    var last = xy[n - 1];
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="' + d + 'L' + w + ' ' + h + 'L0 ' + h + 'Z" fill="' + c + '" fill-opacity="0.10"/>' +
      '<path d="' + d + '" fill="none" stroke="' + c + '" stroke-width="1.5" vector-effect="non-scaling-stroke"/></svg>';
  }

  function drawBig() {
    var it = data.items.filter(function (i) { return i.code === sel; })[0];
    var all = data.series[sel] || [], pts = all.slice(-Math.min(span, all.length));
    $("detail").hidden = false;
    $("dname").textContent = it.name + " · " + md(it.date) + " 기준";
    $("dval").textContent = fmt(it, it.value);
    $("dchg").textContent = chgText(it) + " (전일 대비)";
    $("dchg").className = "chg " + cls(it);
    ["r1", "r3", "r6"].forEach(function (id) { $(id).setAttribute("aria-pressed", String(+$(id).dataset.n === span)); });
    var svg = $("big"), W = 720, H = 260, L = 56, R = 12, T = 12, B = 26;
    var vals = pts.map(function (p) { return p[1]; }), lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    var pad = (hi - lo || Math.abs(hi) * 0.02 || 1) * 0.08; lo -= pad; hi += pad;
    var x = function (i) { return L + (i / (pts.length - 1)) * (W - L - R); };
    var y = function (v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); };
    var col = css(cls(it) === "up" ? "--up" : cls(it) === "down" ? "--down" : "--flat");
    var line = css("--ink"), grid = css("--grid"), mut = css("--muted");
    var out = "";
    for (var k = 0; k <= 4; k++) {
      var v = lo + ((hi - lo) * k) / 4, yy = y(v);
      var lab = Math.abs(hi) >= 1000 ? Math.round(v).toLocaleString("en-US") : Math.abs(hi) >= 100 ? v.toFixed(1) : v.toFixed(2);
      out += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + yy + '" y2="' + yy + '" stroke="' + grid + '"/>' +
        '<text x="' + (L - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" font-family="IBM Plex Mono, monospace" fill="' + mut + '">' + lab + '</text>';
    }
    var ticks = [0, Math.floor((pts.length - 1) / 2), pts.length - 1];
    ticks.forEach(function (i, j) {
      out += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="' + (j === 0 ? "start" : j === 2 ? "end" : "middle") + '" font-size="11" font-family="IBM Plex Mono, monospace" fill="' + mut + '">' + pts[i][0] + '</text>';
    });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p[1]).toFixed(1); }).join("");
    out += '<path d="' + d + 'L' + x(pts.length - 1) + ' ' + (H - B) + 'L' + L + ' ' + (H - B) + 'Z" fill="' + col + '" fill-opacity="0.08"/>' +
      '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" stroke-linejoin="round"/>' +
      '<circle cx="' + x(pts.length - 1) + '" cy="' + y(pts[pts.length - 1][1]) + '" r="4" fill="' + col + '" stroke="' + css("--panel") + '" stroke-width="2"/>' +
      '<line id="cur" x1="0" x2="0" y1="' + T + '" y2="' + (H - B) + '" stroke="' + mut + '" stroke-dasharray="3 3" visibility="hidden"/>';
    svg.innerHTML = out;
    var tip = $("tip");
    tip.textContent = "그래프 위에 마우스를 올리면 날짜별 값을 볼 수 있습니다.";
    function at(ev) {
      var r = svg.getBoundingClientRect(), px = ((ev.clientX - r.left) / r.width) * W;
      var i = Math.max(0, Math.min(pts.length - 1, Math.round(((px - L) / (W - L - R)) * (pts.length - 1))));
      var c = svg.querySelector("#cur"); c.setAttribute("x1", x(i)); c.setAttribute("x2", x(i)); c.setAttribute("visibility", "visible");
      tip.textContent = pts[i][0] + "  " + fmt(it, pts[i][1]);
    }
    svg.onpointermove = at; svg.onpointerdown = at;
  }

  function render() {
    var by = {};
    data.items.forEach(function (i) { (by[i.cat] = by[i.cat] || []).push(i); });
    var html = "";
    ORDER.forEach(function (cat) {
      if (!by[cat]) return;
      html += '<section><h2>' + cat + '</h2>';
      by[cat].forEach(function (it) {
        var k = cls(it), c = css(k === "up" ? "--up" : k === "down" ? "--down" : "--flat");
        html += '<button type="button" class="row" data-code="' + it.code + '" aria-pressed="' + (it.code === sel) + '">' +
          '<span class="rname">' + it.name + '<small>' + md(it.date) + '</small></span>' +
          '<span class="rnum"><b>' + fmt(it, it.value) + '</b><span class="' + k + '">' + chgText(it) + '</span></span>' +
          spark((data.series[it.code] || []).slice(-60), c) + '</button>';
      });
      html += "</section>";
    });
    $("groups").innerHTML = html;
    drawBig();
  }

  $("groups").addEventListener("click", function (e) {
    var b = e.target.closest(".row"); if (!b) return;
    sel = b.dataset.code; render();
  });
  [].forEach.call(document.querySelectorAll(".range button"), function (b) {
    b.addEventListener("click", function () { span = +b.dataset.n; drawBig(); });
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { if (data) render(); });

  fetch("data.json?v=" + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    data = d; $("asof").textContent = "갱신 " + d.generated;
    if (!d.items.some(function (i) { return i.code === sel; })) sel = d.items[0].code;
    render();
  }).catch(function () {
    $("asof").textContent = "";
    $("groups").innerHTML = '<div class="err">데이터를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</div>';
  });
})();
</script>
