<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>시황 지표판</title>
<script>
/* 저장된 화면 모드를 첫 그림 전에 적용 (저장소가 막혀 있어도 정상 동작) */
try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 에디토리얼 톤: 종이색 배경 + 세리프 제목 + 얇은 괘선. 한국 관례대로 상승=빨강, 하락=파랑 */
:root {
  --paper: #f4efe6; --card: #fbf8f2; --ink: #1d1b18; --ink2: #4a453c; --ink3: #6b655a;
  --rule: #ddd5c6; --rule2: #ebe4d6; --up: #b3261e; --down: #1f4fa8; --flat: #6b655a;
  --focus: #1f4fa8; --shadow: 0 1px 2px rgba(60,45,20,.06), 0 6px 18px rgba(60,45,20,.07);
  --serif: "Noto Serif KR", "Nanum Myeongjo", serif;
  --sans: "Pretendard Variable", Pretendard, -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
}
/* 다크: 기기 설정을 따르되, 우측 상단 버튼으로 직접 고르면 data-theme 이 우선한다 */
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #16140f; --card: #1d1b16; --ink: #f0ebe0; --ink2: #c4bdae; --ink3: #a29b8c;
  --rule: #3a362d; --rule2: #2b2822; --up: #ff7a6b; --down: #7aa2ff; --flat: #a29b8c; --focus: #7aa2ff;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); } }
:root[data-theme="dark"] {
  --paper: #16140f; --card: #1d1b16; --ink: #f0ebe0; --ink2: #c4bdae; --ink3: #a29b8c;
  --rule: #3a362d; --rule2: #2b2822; --up: #ff7a6b; --down: #7aa2ff; --flat: #a29b8c; --focus: #7aa2ff;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.35); }
* { box-sizing: border-box; }
html { color-scheme: light dark; }
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 14px/1.5 var(--sans); padding: 28px 16px 56px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1120px; margin: 0 auto; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.up { color: var(--up); } .down { color: var(--down); } .flat { color: var(--flat); }

header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 24px; padding-bottom: 14px; border-bottom: 2px solid var(--ink); }
h1 { font: 700 30px/1.15 var(--serif); letter-spacing: -0.02em; margin: 0; }
.hr { display: flex; align-items: flex-end; gap: 14px; }
.stamp { text-align: right; font-size: 12.5px; color: var(--ink2); line-height: 1.5; }
.stamp b { font-weight: 600; color: var(--ink); }
.theme { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--rule); border-radius: 50%; background: var(--card); color: var(--ink); cursor: pointer; padding: 0; transition: background .15s, transform .15s; }
.theme:hover { background: var(--paper); transform: translateY(-1px); }
.theme svg { width: 17px; height: 17px; display: block; }
.theme .moon { display: none; }
:root[data-mode="light"] .theme .sun { display: none; } :root[data-mode="light"] .theme .moon { display: block; }
.note { margin: 12px 0 0; font-size: 12.5px; color: var(--ink2); }
.note.warn { color: #9a4a07; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .note.warn { color: #f59e0b; } }
:root[data-theme="dark"] .note.warn { color: #f59e0b; }

/* 한글 소제목에는 자간을 주지 않는다 */
.kicker { font: 700 13px/1 var(--sans); color: var(--ink); margin: 30px 0 12px; display: flex; align-items: center; gap: 12px; }
.kicker::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--ink); }
.kicker::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

/* 등락 칩: 색 + 화살표 + 옅은 배경 (색만으로 구분하지 않는다) */
.chip { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-weight: 600; white-space: nowrap; }
.chip.up { background: color-mix(in srgb, var(--up) 12%, transparent); }
.chip.down { background: color-mix(in srgb, var(--down) 12%, transparent); }
.chip.flat { background: color-mix(in srgb, var(--flat) 14%, transparent); }

/* 스파크라인 + 끝점 */
.spw { position: relative; display: block; }
.spw svg { display: block; width: 100%; height: 100%; }
.spdot { position: absolute; right: -2px; width: 7px; height: 7px; margin-top: -3.5px; border-radius: 50%; box-shadow: 0 0 0 2px var(--card); }

/* 핵심 5개 */
.keys { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
.key { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px 12px; text-align: left; font: inherit; color: inherit; cursor: pointer; display: flex; flex-direction: column; align-items: flex-start; gap: 3px; min-width: 0; position: relative; transition: box-shadow .15s, transform .15s, border-color .15s; }
.key:hover { box-shadow: var(--shadow); transform: translateY(-1px); }
.key[aria-pressed="true"] { border-color: var(--ink); box-shadow: var(--shadow); }
.key[aria-pressed="true"]::before { content: ""; position: absolute; left: 14px; right: 14px; top: -1px; height: 3px; border-radius: 0 0 3px 3px; background: var(--ink); }
.kname { font-size: 12.5px; color: var(--ink2); font-weight: 500; }
.kval { font: 500 26px/1.2 var(--serif); letter-spacing: -0.02em; }
.kchg { font-size: 12.5px; }
.key .spw { width: 100%; height: 32px; margin-top: 8px; padding-right: 4px; }

/* 상세 차트 */
.detail { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; padding: 20px 22px 16px; box-shadow: var(--shadow); }
.dhead { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 20px; }
.dname { font: 700 18px/1.3 var(--serif); }
.dsub { font-size: 12.5px; color: var(--ink2); margin-top: 2px; }
.dval { font: 500 40px/1.1 var(--serif); letter-spacing: -0.02em; margin-top: 6px; }
.dchg { font-size: 14px; margin-left: 12px; font-family: var(--sans); vertical-align: 6px; padding: 3px 10px; }
.range { display: inline-flex; padding: 3px; gap: 2px; background: var(--paper); border: 1px solid var(--rule); border-radius: 999px; }
.range button { font: 500 12.5px var(--sans); color: var(--ink2); background: transparent; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; transition: background .15s, color .15s; }
.range button:hover { color: var(--ink); }
.range button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
button:focus-visible, svg:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
#chart { position: relative; margin-top: 10px; }
#big { display: block; width: 100%; touch-action: pan-y; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--paper); border-radius: 4px; padding: 6px 9px; font-size: 12px; line-height: 1.45; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; } .tip span { opacity: .75; }
.hint { font-size: 12px; color: var(--ink3); margin: 6px 0 0; }
details.tbl { margin-top: 10px; border-top: 1px solid var(--rule2); padding-top: 8px; }
details.tbl summary { cursor: pointer; font-size: 12px; color: var(--ink2); }
.tscroll { max-height: 220px; overflow: auto; margin-top: 8px; }
.tscroll table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.tscroll th, .tscroll td { text-align: right; padding: 4px 8px; border-bottom: 1px solid var(--rule2); }
.tscroll th:first-child, .tscroll td:first-child { text-align: left; }
.tscroll th { position: sticky; top: 0; background: var(--card); color: var(--ink3); font-weight: 500; }

/* 좌: 차트(고정) / 우: 세로 스크롤 지표 목록 */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 20px; align-items: start; }
.left { position: sticky; top: 16px; }
.list { background: var(--card); border: 1px solid var(--rule); border-radius: 8px; box-shadow: var(--shadow); max-height: calc(100vh - 32px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.list::-webkit-scrollbar { width: 8px; }
.list::-webkit-scrollbar-track { background: transparent; }
.list::-webkit-scrollbar-thumb { background: var(--rule); border-radius: 8px; border: 2px solid var(--card); }
.list::-webkit-scrollbar-thumb:hover { background: var(--ink3); }
.list h2 { position: sticky; top: 0; z-index: 1; margin: 0; padding: 10px 14px 9px; background: var(--paper); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); font: 700 12.5px/1 var(--sans); color: var(--ink); }
.list section:first-child h2 { border-top: 0; }
.row { width: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto 60px; align-items: center; gap: 10px; padding: 10px 14px; background: transparent; border: 0; border-bottom: 1px solid var(--rule2); border-left: 3px solid transparent; font: inherit; color: inherit; text-align: left; cursor: pointer; transition: background .12s; }
.row:hover { background: var(--paper); }
.row[aria-pressed="true"] { background: var(--paper); border-left-color: var(--ink); box-shadow: inset 0 0 0 1px var(--rule); }
.rname { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rname small { display: block; font-size: 11.5px; font-weight: 400; color: var(--ink3); }
.rnum { text-align: right; line-height: 1.3; }
.rnum b { display: block; font: 500 15px/1.3 var(--serif); }
.rnum .chip { font-size: 11.5px; padding: 1px 6px; margin-top: 2px; }
.row .spw { width: 60px; height: 26px; padding-right: 4px; }
.row .spdot { width: 6px; height: 6px; margin-top: -3px; }

footer { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--rule); font-size: 11.5px; line-height: 1.7; color: var(--ink3); }
.err { padding: 24px; color: var(--ink2); }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr); } .left { position: static; } .list { max-height: none; } }
@media (max-width: 820px) {
  .keys { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .key:last-child { grid-column: span 2; }
  .hr { gap: 10px; }
  h1 { font-size: 25px; } .stamp { text-align: left; } .dval { font-size: 32px; }
  .detail { padding: 14px 12px 10px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>시황 지표판</h1>
    <div class="hr">
      <div class="stamp" id="stamp">불러오는 중</div>
      <button type="button" class="theme" id="theme" aria-label="화면 모드 전환" title="라이트/다크 전환">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </header>
  <p class="note">전일 종가 기준이며 지표마다 기준일이 다릅니다. 국내 금리·회사채는 한국은행 발표 기준이라 하루 늦고, 휴장일에는 직전 거래일 값을 표시합니다.</p>
  <p class="note warn" id="warn" hidden></p>

  <div class="kicker">오늘의 핵심</div>
  <div class="keys" id="keys"></div>

  <div class="kicker">추이 · 전체 지표</div>
  <div class="layout">
  <div class="left">
  <div class="detail" id="detail" hidden>
    <div class="dhead">
      <div>
        <div class="dname" id="dname"></div>
        <div class="dsub" id="dsub"></div>
        <div><span class="dval num" id="dval"></span><span class="dchg num" id="dchg"></span></div>
      </div>
      <div class="range" role="group" aria-label="기간">
        <button type="button" data-n="22" aria-pressed="false">1개월</button>
        <button type="button" data-n="66" aria-pressed="false">3개월</button>
        <button type="button" data-n="999" aria-pressed="true">전체</button>
      </div>
    </div>
    <div id="chart"><svg id="big" role="img" tabindex="0" aria-label="선택한 지표 추이"></svg><div class="tip num" id="tip"></div></div>
    <p class="hint">그래프 위에 마우스를 올리거나 방향키(←→)로 날짜별 값을 볼 수 있습니다.</p>
    <details class="tbl"><summary>표로 보기</summary><div class="tscroll" id="tbl"></div></details>
  </div>
  </div>

  <div class="list" id="groups" aria-label="지표 목록"></div>
  </div>

  <footer>출처: Yahoo Finance(지수·환율·원자재), FRED(美 국채), 한국은행 ECOS(국고채·CD·회사채). 신용스프레드는 회사채 3년 금리에서 국고채 3년 금리를 뺀 값입니다. 평일 오전·오후 자동 갱신.</footer>
</div>

<script>
(function () {
  var ORDER = ["국내주식", "해외주식", "변동성", "국내금리", "크레딧", "해외금리", "환율", "원자재"];
  var KEYS = ["KOSPI", "US10Y", "KTB3Y", "USDKRW", "WTI"];
  var data = null, items = {}, sel = "KOSPI", span = 999, idx = -1;
  var $ = function (id) { return document.getElementById(id); };
  var css = function (v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); };
  var NS = "http://www.w3.org/2000/svg";

  /* ---------- 숫자 표기 ---------- */
  function group(v, dec) { return v.toLocaleString("en-US", { minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  function fmt(it, v) {
    switch (it.unit) {
      case "%": return group(v, 3) + "%";
      case "bp": return group(v, 1) + "bp";
      case "$": return "$" + group(v, 2);
      case "원": return group(v, 2) + "원";
      default: return group(v, Math.abs(v) >= 1000 ? 2 : 2);
    }
  }
  function axisFmt(it, v, dec) {
    var s = group(v, dec);
    return it.unit === "%" ? s + "%" : it.unit === "bp" ? s + "bp" : it.unit === "$" ? "$" + s : s;
  }
  function chg(it) {
    var c = it.change, a = c > 0 ? "▲" : c < 0 ? "▼" : "–";
    return a + " " + Math.abs(c).toFixed(it.change_unit === "bp" ? 1 : 2) + it.change_unit;
  }
  function dir(it) { return it.change > 0 ? "up" : it.change < 0 ? "down" : "flat"; }
  function md(d) { return d.slice(5).replace("-", "/"); }

  /* ---------- 깔끔한 축 눈금 (1·2·5 단위) ---------- */
  function niceNum(x, round) {
    var e = Math.floor(Math.log10(x)), f = x / Math.pow(10, e), n;
    if (round) n = f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10; else n = f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10;
    return n * Math.pow(10, e);
  }
  function niceTicks(lo, hi, want) {
    var step = niceNum((hi - lo) / (want - 1), true), t = [], v = Math.ceil(lo / step - 1e-9) * step;
    for (; v <= hi + step * 1e-9; v += step) t.push(+v.toPrecision(12));
    var dec = step >= 1 ? 0 : Math.min(4, Math.ceil(-Math.log10(step) - 1e-9));
    return { ticks: t, dec: dec };
  }

  /* ---------- 작은 SVG 헬퍼 ---------- */
  function el(tag, attrs, parent) {
    var n = document.createElementNS(NS, tag);
    for (var k in attrs) n.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(n);
    return n;
  }
  function sparkSvg(pts, color, cls) {
    var w = 100, h = 28, vs = pts.map(function (p) { return p[1]; });
    var lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs), r = hi - lo || 1, n = pts.length;
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + (i / (n - 1) * w).toFixed(2) + " " + (h - 2 - (p[1] - lo) / r * (h - 4)).toFixed(2); }).join("");
    var ly = (h - 2 - (vs[n - 1] - lo) / r * (h - 4)) / h * 100;   // 끝점 높이(%)
    return '<span class="spw"><svg viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" aria-hidden="true">' +
      '<path d="' + d + 'L' + w + " " + h + 'L0 ' + h + 'Z" fill="' + color + '" fill-opacity=".14"/>' +
      '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>' +
      '<i class="spdot" style="top:' + ly.toFixed(1) + '%;background:' + color + '"></i></span>';
  }
  function chip(it) { return '<span class="chip num ' + dir(it) + '">' + chg(it) + '</span>'; }
  function colorOf(it) { return css("--" + dir(it)); }

  /* ---------- 상세 차트 ---------- */
  function visible() {
    var all = data.series[sel] || [];
    return all.slice(-Math.min(span, all.length));
  }
  function drawBig() {
    var it = items[sel], pts = visible();
    $("detail").hidden = false;
    $("dname").textContent = it.name;
    $("dsub").textContent = md(it.date) + " 기준 · " + it.cat;
    $("dval").textContent = fmt(it, it.value);
    var c = $("dchg"); c.textContent = chg(it); c.className = "dchg chip num " + dir(it);
    [].forEach.call(document.querySelectorAll(".range button"), function (b) { b.setAttribute("aria-pressed", String(+b.dataset.n === span)); });

    var svg = $("big"), W = Math.max(280, $("chart").clientWidth), H = W < 520 ? 240 : 300;
    var L = 8, R = 62, T = 14, B = 26;       // 값 눈금은 오른쪽에 둔다 (신문 시세표 관례)
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("height", H);
    svg.innerHTML = "";
    var vs = pts.map(function (p) { return p[1]; }), lo = Math.min.apply(null, vs), hi = Math.max.apply(null, vs);
    var pad = (hi - lo || Math.abs(hi) * 0.02 || 1) * 0.12; lo -= pad; hi += pad;
    var X = function (i) { return L + i / (pts.length - 1) * (W - L - R); };
    var Y = function (v) { return T + (1 - (v - lo) / (hi - lo)) * (H - T - B); };
    var col = colorOf(it), ink3 = css("--ink3"), rule = css("--rule2"), ink = css("--ink");
    var fam = css("--sans");

    var nt = niceTicks(lo, hi, H < 280 ? 4 : 5);
    nt.ticks.forEach(function (v) {
      el("line", { x1: L, x2: W - R, y1: Y(v), y2: Y(v), stroke: rule, "stroke-width": 1 }, svg);
      var t = el("text", { x: W - R + 8, y: Y(v) + 4, "font-size": 11.5, fill: ink3, "font-family": fam }, svg); t.textContent = axisFmt(it, v, nt.dec);
    });
    // x축: 월 시작 지점에 "N월", 월 경계가 부족하면(1개월) 균등 간격 M/D
    var xt = [];
    for (var i = 1; i < pts.length; i++) if (pts[i][0].slice(5, 7) !== pts[i - 1][0].slice(5, 7)) xt.push([i, +pts[i][0].slice(5, 7) + "월"]);
    if (xt.length < 2) { xt = []; [0, 1, 2, 3].forEach(function (k) { var j = Math.round(k * (pts.length - 1) / 3); xt.push([j, md(pts[j][0])]); }); }
    xt.forEach(function (p, k) {
      var x = X(p[0]);
      el("line", { x1: x, x2: x, y1: H - B, y2: H - B + 4, stroke: ink3 }, svg);
      var t = el("text", { x: x, y: H - 8, "text-anchor": xt.length && k === xt.length - 1 && x > W - R - 20 ? "end" : "middle", "font-size": 11.5, fill: ink3, "font-family": fam }, svg); t.textContent = p[1];
    });
    el("line", { x1: L, x2: W - R, y1: H - B, y2: H - B, stroke: ink3, "stroke-width": 1 }, svg);

    var defs = el("defs", {}, svg), g = el("linearGradient", { id: "grad", x1: 0, x2: 0, y1: 0, y2: 1 }, defs);
    el("stop", { offset: "0%", "stop-color": col, "stop-opacity": .26 }, g); el("stop", { offset: "100%", "stop-color": col, "stop-opacity": 0 }, g);
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[1]).toFixed(1); }).join("");
    el("path", { d: d + "L" + X(pts.length - 1) + " " + (H - B) + "L" + X(0) + " " + (H - B) + "Z", fill: "url(#grad)" }, svg);
    el("path", { d: d, fill: "none", stroke: col, "stroke-width": 2.2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);

    // 기간 내 최고·최저 표시
    var iMax = vs.indexOf(Math.max.apply(null, vs)), iMin = vs.indexOf(Math.min.apply(null, vs));
    [[iMax, -9, "최고"], [iMin, 17, "최저"]].forEach(function (m) {
      var i = m[0], x = X(i), y = Y(vs[i]);
      el("circle", { cx: x, cy: y, r: 3, fill: css("--card"), stroke: ink, "stroke-width": 1.4 }, svg);
      var a = x > W - R - 70 ? "end" : x < L + 70 ? "start" : "middle";
      var t = el("text", { x: a === "end" ? x + 2 : a === "start" ? x - 2 : x, y: y + m[1], "text-anchor": a, "font-size": 11.5, fill: ink, "font-family": fam, "font-weight": 600 }, svg);
      t.textContent = m[2] + " " + axisFmt(it, vs[i], it.unit === "%" ? 3 : it.unit === "bp" ? 1 : 2);
      var bb = t.getBBox();   // 라벨 뒤에 옅은 알약 배경을 깔아 선과 겹쳐도 읽히게 한다
      var pill = el("rect", { x: bb.x - 5, y: bb.y - 2, width: bb.width + 10, height: bb.height + 4, rx: 5, fill: css("--card"), "fill-opacity": .92, stroke: rule }, svg);
      svg.insertBefore(pill, t);
    });
    // 현재값
    var lx = X(pts.length - 1), ly = Y(vs[vs.length - 1]);
    el("circle", { cx: lx, cy: ly, r: 4.5, fill: col, stroke: css("--card"), "stroke-width": 2 }, svg);

    var cur = el("line", { id: "cur", x1: 0, x2: 0, y1: T, y2: H - B, stroke: ink3, "stroke-dasharray": "3 3", visibility: "hidden" }, svg);
    var dot = el("circle", { id: "cdot", r: 4.5, fill: col, stroke: css("--card"), "stroke-width": 2, visibility: "hidden" }, svg);
    var tip = $("tip");
    function show(i) {
      i = Math.max(0, Math.min(pts.length - 1, i)); idx = i;
      var x = X(i), y = Y(vs[i]), prev = i ? vs[i - 1] : null;
      cur.setAttribute("x1", x); cur.setAttribute("x2", x); cur.setAttribute("visibility", "visible");
      dot.setAttribute("cx", x); dot.setAttribute("cy", y); dot.setAttribute("visibility", "visible");
      var diff = prev == null ? "" : (it.unit === "%" || it.unit === "bp" ? ((vs[i] - prev) * (it.unit === "%" ? 100 : 1)).toFixed(1) + "bp" : ((vs[i] / prev - 1) * 100).toFixed(2) + "%");
      var sign = prev == null ? "" : (vs[i] >= prev ? "+" : "");
      tip.innerHTML = "<span>" + pts[i][0] + "</span><br><b>" + fmt(it, vs[i]) + "</b>" + (diff ? " <span>(" + sign + diff + ")</span>" : "");
      tip.style.left = Math.max(60, Math.min(W - 60, x)) + "px"; tip.style.top = Math.max(46, y - 10) + "px"; tip.style.opacity = 1;
    }
    function hide() { cur.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.style.opacity = 0; }
    function at(ev) { var r = svg.getBoundingClientRect(); show(Math.round(((ev.clientX - r.left - L) / (W - L - R)) * (pts.length - 1))); }
    svg.onpointermove = at; svg.onpointerdown = at; svg.onpointerleave = hide;
    svg.onkeydown = function (e) {
      if (e.key === "ArrowLeft") { show((idx < 0 ? pts.length - 1 : idx) - 1); e.preventDefault(); }
      if (e.key === "ArrowRight") { show((idx < 0 ? pts.length - 1 : idx) + 1); e.preventDefault(); }
      if (e.key === "Escape") hide();
    };
    svg.onblur = hide;

    // 표 보기 (최근 값이 위)
    var rows = pts.slice().reverse().map(function (p, k, a) {
      var nxt = a[k + 1]; var df = nxt ? (it.unit === "%" ? ((p[1] - nxt[1]) * 100).toFixed(1) + "bp" : it.unit === "bp" ? (p[1] - nxt[1]).toFixed(1) + "bp" : ((p[1] / nxt[1] - 1) * 100).toFixed(2) + "%") : "";
      return "<tr><td>" + p[0] + "</td><td class='num'>" + fmt(it, p[1]) + "</td><td class='num'>" + df + "</td></tr>";
    }).join("");
    $("tbl").innerHTML = "<table><thead><tr><th>날짜</th><th>값</th><th>전일 대비</th></tr></thead><tbody>" + rows + "</tbody></table>";
  }

  /* ---------- 핵심 5개 · 구분별 타일 ---------- */
  function rangePos(code, v) {
    var s = (data.series[code] || []).map(function (p) { return p[1]; });
    var lo = Math.min.apply(null, s), hi = Math.max.apply(null, s);
    return { lo: lo, hi: hi, p: hi === lo ? 50 : Math.round((v - lo) / (hi - lo) * 100) };
  }
  function short(it, v) { // 범위 막대 양 끝 값 (짧게)
    var s = it.unit === "%" ? v.toFixed(2) : it.unit === "bp" ? v.toFixed(0) : Math.abs(v) >= 1000 ? Math.round(v).toLocaleString("en-US") : Math.abs(v) >= 100 ? v.toFixed(1) : v.toFixed(2);
    return s;
  }
  function render() {
    $("keys").innerHTML = KEYS.filter(function (k) { return items[k]; }).map(function (k) {
      var it = items[k], c = colorOf(it);
      return '<button type="button" class="key" data-code="' + k + '" aria-pressed="' + (k === sel) + '">' +
        '<span class="kname">' + it.name + '</span><span class="kval num">' + fmt(it, it.value) + '</span>' +
        '<span class="kchg">' + chip(it) + '</span>' + sparkSvg((data.series[k] || []).slice(-60), c) + '</button>';
    }).join("");
    var by = {};
    data.items.forEach(function (i) { (by[i.cat] = by[i.cat] || []).push(i); });
    var html = "";
    ORDER.forEach(function (cat) {
      if (!by[cat]) return;
      html += '<section><h2>' + cat + '</h2>';
      by[cat].forEach(function (it) {
        html += '<button type="button" class="row" data-code="' + it.code + '" aria-pressed="' + (it.code === sel) + '">' +
          '<span class="rname">' + it.name + '<small class="num">' + md(it.date) + '</small></span>' +
          '<span class="rnum num"><b>' + fmt(it, it.value) + '</b>' + chip(it) + '</span>' +
          sparkSvg((data.series[it.code] || []).slice(-60), colorOf(it)) + '</button>';
      });
      html += "</section>";
    });
    $("groups").innerHTML = html;
    drawBig();
  }

  function pick(code) {
    sel = code; idx = -1; render();
    var d = $("detail").getBoundingClientRect();
    if (innerWidth <= 900 && (d.top < 0 || d.top > innerHeight * 0.6)) $("detail").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-code]"); if (b) pick(b.dataset.code);
  });
  [].forEach.call(document.querySelectorAll(".range button"), function (b) {
    b.addEventListener("click", function () { span = +b.dataset.n; idx = -1; drawBig(); });
  });
  var rt; addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(function () { if (data) drawBig(); }, 120); });
  /* ---------- 화면 모드: 기기 설정을 따르되 버튼으로 직접 고르면 기억한다 ---------- */
  var mq = matchMedia("(prefers-color-scheme: dark)");
  function mode() { var t = document.documentElement.getAttribute("data-theme"); return t || (mq.matches ? "dark" : "light"); }
  function syncMode() { document.documentElement.setAttribute("data-mode", mode()); }
  syncMode();
  $("theme").addEventListener("click", function () {
    var next = mode() === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    syncMode(); if (data) render();
  });
  mq.addEventListener("change", function () { syncMode(); if (data) render(); });

  fetch("data.json?v=" + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    data = d; d.items.forEach(function (i) { items[i.code] = i; });
    var g = d.generated || "", days = ["일", "월", "화", "수", "목", "금", "토"], dt = new Date(g.replace(" ", "T") + ":00");
    $("stamp").innerHTML = isNaN(dt) ? "갱신 " + g : "<b>" + dt.getFullYear() + "년 " + (dt.getMonth() + 1) + "월 " + dt.getDate() + "일 " + days[dt.getDay()] + "요일</b><br>갱신 " + g.slice(11) + " KST";
    if (d.notes && d.notes.length) {
      var w = $("warn"); w.hidden = false;
      w.textContent = "⚠ 일부 지표는 대체 경로이거나 수집에 실패해 기준일이 늦을 수 있습니다 (" + d.notes.slice(0, 3).join(" / ") + (d.notes.length > 3 ? " 외 " + (d.notes.length - 3) + "건" : "") + ")";
    }
    if (!items[sel]) sel = d.items[0].code;
    render();
  }).catch(function () {
    $("stamp").textContent = "";
    $("groups").innerHTML = '<div class="err">데이터를 불러오지 못했습니다. 잠시 후 다시 열어 주세요.</div>';
  });
})();
</script>
