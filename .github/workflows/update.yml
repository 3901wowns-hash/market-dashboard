name: update-dashboard
on:
  schedule:
    - cron: "30 22 * * 1-5"   # 07:30 KST 화~토 (미국 마감 반영)
    - cron: "30 7 * * 1-5"    # 16:30 KST 월~금 (국내 마감 반영)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_market.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      - run: mkdir site && cp index.html data.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
