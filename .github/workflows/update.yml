name: update-dashboard
on:
  schedule:
    - cron: "17 22 * * 1-5"   # 07:17 KST 화~토 (미국 마감 반영). 정각·30분은 몰려서 지연/누락이 잦아 어중간한 분으로 둠
    - cron: "43 7 * * 1-5"    # 16:43 KST 월~금 (국내 마감 반영)
    - cron: "1 8 * * *"   # TEMP test (remove after check)
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fetch_market.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
      - run: mkdir site && cp index.html data.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
